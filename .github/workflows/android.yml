name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Cada trabajo hace cola por separado: la compilación de un push nuevo (y su APK) no espera a que
# termine el emulador del run anterior.
jobs:
  build:
    name: Compilar, pruebas JVM y APK
    runs-on: ubuntu-latest
    concurrency:
      group: android-build-${{ github.ref }}
      cancel-in-progress: false
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
      # La rama trae evidencias publicadas por runs anteriores: sin borrarlas, el artifact las
      # empaquetaba junto a las de este run.
      - name: Limpiar evidencias heredadas
        run: rm -rf output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Las pruebas JVM se ejecutan siempre de nuevo (--rerun): sin eso Gradle restauraba sus
      # resultados de la caché y el run no demostraba haberlas corrido.
      - name: Pruebas JVM del motor + pruebas unitarias de la app (ejecución fresca)
        run: |
          mkdir -p output
          set -o pipefail
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ./gradlew --console=plain --stacktrace \
            :core:test --rerun :ai:test --rerun :app:testDebugUnitTest --rerun 2>&1 | tee jvm-tests.log
          {
            echo "source_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "tests_started_at=$started"
            echo "tests_finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            grep -E '^> Task :(core:test|ai:test|app:testDebugUnitTest)( |$)' jvm-tests.log | sed 's/^> Task /task /'
          } | tee output/jvm-provenance.txt
          if grep -qE '^> Task :(core:test|ai:test|app:testDebugUnitTest) (FROM-CACHE|UP-TO-DATE)' jvm-tests.log; then
            echo "Las pruebas JVM no se ejecutaron en este run" >&2; exit 1
          fi
      - name: APK
        run: >
          ./gradlew --console=plain --stacktrace
          :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Evidencias del motor (render JVM rotulado)
        if: always()
        run: |
          mkdir -p output/jvm
          cp core/build/reports/trazo-evidence/*.png core/build/reports/trazo-evidence/*.txt output/jvm/ 2>/dev/null || true
      - name: Reunir APKs
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Trazo-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/Trazo-debug-androidTest.apk
          sha256sum output/*.apk | tee output/SHA256SUMS-apk.txt
          {
            echo "source_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "ref=$GITHUB_REF_NAME"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sed 's/^/sha256 /' output/SHA256SUMS-apk.txt
          } | tee output/build-provenance.txt
          ls -la output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trazo-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            core/build/reports/tests/
            core/build/test-results/
            ai/build/reports/tests/
            ai/build/test-results/
            app/build/reports/tests/
            app/build/test-results/

  emulator:
    name: Emulador (${{ matrix.fase }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: android-emulator-${{ github.ref }}-${{ matrix.fase }}
      cancel-in-progress: false
    # El recorrido de la interfaz va en un emulador aparte con render en el invitado: con
    # swiftshader_indirect el diálogo de color tumbaba el renderizador del host y al emulador.
    strategy:
      fail-fast: false
      matrix:
        include:
          - fase: pruebas,demo
            gpu: swiftshader_indirect
          - fase: interfaz
            gpu: guest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trazo-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact
      # Cada fase escribe en un directorio vacío propio: el artifact lleva solo lo de esta fase y
      # de este run, con la procedencia de la compilación que probó.
      - name: Comprobar procedencia
        run: |
          grep -qx "source_sha=$GITHUB_SHA" artifact/output/build-provenance.txt
          grep -qx "run_id=$GITHUB_RUN_ID" artifact/output/build-provenance.txt
          grep -qx "run_attempt=$GITHUB_RUN_ATTEMPT" artifact/output/build-provenance.txt
          (cd artifact && sed -n 's/^sha256 //p' output/build-provenance.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/fase"
          { cat artifact/output/build-provenance.txt; echo "fase=${{ matrix.fase }}"; } > "$RUNNER_TEMP/fase/build-provenance-$(echo '${{ matrix.fase }}' | tr , -).txt"
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android 34 (Pixel 6) — pruebas y grabación
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # Con la RAM por defecto el emulador se cerraba solo tras la demo grabada.
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-emulator.sh artifact/output ${{ runner.temp }}/fase ${{ matrix.fase }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trazo-emulator-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fase/

  # Una sola publicación por run, con todo junto: la APK solo llega a la rama si la compilación y las
  # dos fases del emulador pasaron, en un commit completo que no mezcla evidencias de otro run.
  publish:
    name: Publicar APK y evidencias
    needs: [build, emulator]
    if: ${{ success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publicar]'))) }}
    runs-on: ubuntu-latest
    concurrency:
      group: android-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: trazo-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle/build
      - uses: actions/download-artifact@v4
        with:
          name: trazo-emulator-0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle/emulator-demo
      - uses: actions/download-artifact@v4
        with:
          name: trazo-emulator-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle/emulator-ui
      - name: Armar la publicación y validar procedencia
        run: bash scripts/ci-stage.sh "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/publication/output"
      - name: Publicar un commit completo
        run: bash scripts/ci-publish.sh "${{ github.ref_name }}" "$RUNNER_TEMP/publication/output" "APK y evidencias del run $GITHUB_RUN_ID [skip ci]"
