name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar, pruebas JVM y APK
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas JVM del motor + pruebas unitarias de la app + APK
        run: >
          ./gradlew --console=plain --stacktrace
          :core:test :app:testDebugUnitTest
          :app:assembleDebug :app:assembleDebugAndroidTest
          -Ptrazo.frames=true
      - name: Video del motor (simulación JVM, rotulada)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p output/jvm
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          if ls core/build/reports/trazo-evidence/frames/*.png >/dev/null 2>&1; then
            ffmpeg -loglevel error -y -framerate 30 -i core/build/reports/trazo-evidence/frames/f%05d.png \
              -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -c:v libx264 -pix_fmt yuv420p output/jvm/simulacion-motor-jvm.mp4
          fi
          cp core/build/reports/trazo-evidence/*.png core/build/reports/trazo-evidence/*.txt output/jvm/ 2>/dev/null || true
      - name: Reunir APKs
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Trazo-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/Trazo-debug-androidTest.apk
          sha256sum output/*.apk | tee output/SHA256SUMS-apk.txt
          ls -la output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trazo-build
          path: |
            output/
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/

  emulator:
    name: Pruebas instrumentadas + demo grabada (emulador)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trazo-build
          path: artifact
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android 34 (Pixel 6) — pruebas y grabación
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-emulator.sh artifact/output output/emulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trazo-emulator
          path: output/emulator/
      - name: Publicar evidencias en la rama
        if: ${{ success() && (contains(github.event.head_commit.message, '[publicar]') || github.event_name == 'workflow_dispatch') }}
        run: |
          mkdir -p output
          cp artifact/output/Trazo-debug.apk artifact/output/SHA256SUMS-apk.txt output/
          mkdir -p output/jvm && cp -r artifact/output/jvm/. output/jvm/ || true
          mv output/emulator/demo-real-android-emulador.mp4 output/demo-real-android.mp4 || true
          git config user.name "trazo-ci"
          git config user.email "trazo-ci@users.noreply.github.com"
          for p in output/Trazo-debug.apk output/SHA256SUMS-apk.txt output/jvm output/emulator output/demo-real-android.mp4; do
            if [ -e "$p" ]; then git add -f "$p"; fi
          done
          git commit -m "Evidencias de CI: APK, demo en emulador y reportes [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
